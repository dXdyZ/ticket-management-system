  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: root
    password: werpipl15
  data:
    redis:
      port: 6379
      host: localhost
      timeout: 2000ms # Таймаут подключения (2 секунды)
